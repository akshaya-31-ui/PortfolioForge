# Railway assigns its own port dynamically; falls back to 8080 locally
server.port=${PORT:8080}

# MySQL — Railway auto-populates these when you add its MySQL plugin
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Gemini
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=${GEMINI_API_MODEL:gemini-3.6-flash}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS — comma-separated list, supports local dev + production at once
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}